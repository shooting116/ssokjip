name: 실거래 매일 갱신
# 매일 06:10 KST — 최근 3개월을 다시 받아 늦게 신고된 건·해제 건을 반영한다. 변경이 있으면 커밋 → Cloudflare가 자동 빌드.
on:
  schedule:
    - cron: '10 21 * * *'   # UTC 21:10 = KST 06:10
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 최근 3개월 다시 받기
        id: fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-trades.mjs --mode refresh --months 3 --max-calls 450
      # 백필이 덜 끝났으면 남은 쿼터로 이어서 받는다 (다 끝나면 "할 일이 없습니다"로 바로 끝남)
      - name: 백필 이어받기
        id: backfill
        if: steps.fetch.outputs.stop == ''
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-trades.mjs --mode backfill --months 36 --max-calls $(( 930 - ${{ steps.fetch.outputs.calls || 0 }} ))
      # K-apt 기본정보는 별도 쿼터(하루 1,000회)라 매일 900건씩 이어받는다. 다 받으면 바로 끝난다.
      - name: K-apt 기본정보 이어받기
        if: always()
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-complexes.mjs --mode info --all --detail true --max-calls 900 --max-minutes 40
      # 건축물대장(건축HUB)도 별도 쿼터 — K-apt에 없는 단지의 세대수를 매일 이어받는다. 대상이 없으면 바로 끝난다.
      - name: 건축물대장 세대수 이어받기
        if: always()
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-bldg.mjs --mode fill --max-calls 900 --max-minutes 30
      - name: 실거래 ↔ K-apt 매칭 · 정비사업 매칭
        if: always()
        run: node scripts/match-complexes.mjs && node scripts/match-redev.mjs
      - name: 커밋·푸시
        if: always()
        run: |
          git config user.name "ssokjip-bot"
          git config user.email "bot@korea-rich.com"
          git add data/trades data/complexes
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "실거래 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d): 최근 3개월 ${{ steps.fetch.outputs.changed }}개 변경 · 백필 ${{ steps.backfill.outputs.done || 0 }}건 (호출 $(( ${{ steps.fetch.outputs.calls || 0 }} + ${{ steps.backfill.outputs.calls || 0 }} )))"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 요약
        if: always()
        run: |
          {
            echo "### 실거래 매일 갱신"
            echo "- 최근 3개월: ${{ steps.fetch.outputs.done }}/${{ steps.fetch.outputs.jobs }} · 호출 ${{ steps.fetch.outputs.calls }} · 파일 변경 ${{ steps.fetch.outputs.changed }}"
            echo "- 백필 이어받기: ${{ steps.backfill.outputs.done || 0 }}/${{ steps.backfill.outputs.jobs || 0 }} · 호출 ${{ steps.backfill.outputs.calls || 0 }}"
            if [ -n "${{ steps.fetch.outputs.stop }}${{ steps.backfill.outputs.stop }}" ]; then echo "- 중단: ${{ steps.fetch.outputs.stop }} ${{ steps.backfill.outputs.stop }}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
