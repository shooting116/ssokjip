name: 기준금리 결정 감시
# 평일 10:50·13:20 KST — 한국은행 통화정책방향 결정회의(연 8회) 결정문이 올라왔는지 보고, 새 결정이 있으면 카카오톡으로 알린다.
# 회의가 없는 날이나 결정문이 아직 안 올라온 시각에는 아무것도 하지 않는다. 가이드·규칙표는 자동으로 바꾸지 않는다.
on:
  schedule:
    - cron: '50 1 * * 1-5'   # UTC 01:50 = KST 10:50 (결정 발표는 보통 10시 전후)
    - cron: '20 4 * * 1-5'   # UTC 04:20 = KST 13:20 (오전에 못 잡았을 때 한 번 더)
  workflow_dispatch:
    inputs:
      probe:
        description: '점검 모드(--probe): 읽은 결과만 보고 상태 저장·알림은 하지 않음'
        type: boolean
        default: false

concurrency:
  group: bok-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 감시 + 알림
        id: watch
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: node scripts/watch-bok.mjs ${{ inputs.probe && '--probe' || '--notify' }}
      - name: 커밋·푸시
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "ssokjip-bot"
          git config user.email "bot@korea-rich.com"
          git add data/watch/bok-state.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "기준금리 감시 $(TZ=Asia/Seoul date +%F): ${{ steps.watch.outputs.event || '상태 갱신' }}"
          git pull --rebase origin main
          git push origin HEAD:main
