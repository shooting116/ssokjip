name: 부동산원 주간 지수 갱신
# 매주 금 09:20 KST — 한국부동산원 주간 아파트 매매가격지수(목요일 발표)를 받아 data/rone/weekly.json 갱신 → 커밋 → Cloudflare 자동 빌드
on:
  schedule:
    - cron: '20 0 * * 5'   # UTC 금 00:20 = KST 금 09:20
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 주간 지수 받기
        id: fetch
        env:
          RONE_KEY: ${{ secrets.RONE_KEY }}
        run: node scripts/fetch-rone.mjs --mode weekly --weeks 520
      - name: 커밋·푸시
        if: always()
        run: |
          git config user.name "ssokjip-bot"
          git config user.email "bot@korea-rich.com"
          git add data/rone
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "부동산원 주간 지수 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d): 최근 주 ${{ steps.fetch.outputs.latest }} · 지역 ${{ steps.fetch.outputs.regions }}"
          git pull --rebase origin main
          git push origin HEAD:main
